name: Docker

on:
  pull_request:
  push:
    branches: [master, php83]
  schedule:
    # Weekly rebuild to pick up PHP / Alpine security updates (Mondays 04:17 UTC)
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: nirgf/speedtest-tracker-v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: tags
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          # The weekly run ignores the cache so Alpine packages (nginx etc.) are refreshed too
          no-cache: ${{ github.event_name == 'schedule' }}
          load: true
          tags: speedtest-tracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image does not reference the old images
        run: docker/check-references.sh speedtest-tracker:ci

      - name: Smoke test with an empty /config volume
        run: docker/smoke-test.sh speedtest-tracker:ci 8080

      # A /config volume initialised by the old public image must keep working
      - name: Upgrade test from the old image
        run: docker/upgrade-test.sh nirgf/speedtest-tracker-v2:latest speedtest-tracker:ci 8081

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same inputs as "Build image", so every layer comes from the build cache
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:php83
            ${{ env.IMAGE }}:php83-${{ steps.tags.outputs.date }}
          cache-from: type=gha

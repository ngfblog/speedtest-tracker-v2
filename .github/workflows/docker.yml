name: Docker

on:
  pull_request:
  push:
    branches: [master, php83]
  schedule:
    # Weekly rebuild to pick up PHP / Alpine security updates (Mondays 04:17 UTC)
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: nirgf/speedtest-tracker-v2
  # The old PHP 7.4 image (formerly ":latest", pushed 2026-02-12)
  OLD_IMAGE: nirgf/speedtest-tracker-v2@sha256:d729653c2554ebced85a9747e23e479a0bd2289c8e6cb7f728299e99d89ab371

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # php83 and php83-YYYYMMDD on every push; "latest" too, but only from master
      # (push, weekly schedule or workflow_dispatch), never from other branches or PRs
      - name: Image tags
        id: tags
        env:
          LATEST: ${{ github.ref == 'refs/heads/master' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) }}
        run: |
          date="$(date -u +%Y%m%d)"
          {
            echo "date=$date"
            echo "list<<EOF"
            echo "$IMAGE:php83"
            echo "$IMAGE:php83-$date"
            if [ "$LATEST" = true ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          # The weekly run ignores the cache so Alpine packages (nginx etc.) are refreshed too
          no-cache: ${{ github.event_name == 'schedule' }}
          load: true
          tags: speedtest-tracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image does not reference the old images
        run: docker/check-references.sh speedtest-tracker:ci

      - name: Smoke test with an empty /config volume
        run: docker/smoke-test.sh speedtest-tracker:ci 8080

      # A /config volume initialised by the old public PHP 7.4 image must keep working.
      # Pinned by digest: "latest" was that image until this workflow started pushing it.
      - name: Upgrade test from the old image
        run: docker/upgrade-test.sh ${{ env.OLD_IMAGE }} speedtest-tracker:ci 8081

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same inputs as "Build image", so every layer comes from the build cache
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha

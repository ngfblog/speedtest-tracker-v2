; Loaded after the official zz-docker.conf so these settings win.
; The pool user and group come from zzz-user.conf, generated by entrypoint.sh.
[global]
error_log = /proc/self/fd/2

[www]
listen = 127.0.0.1:9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
